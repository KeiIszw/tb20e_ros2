/**/controller_manager:
  ros__parameters:
    # This rate also determines the lever publication period: 20 Hz = 50 ms.
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tb20e_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    tb20e_gamepad_controller:
      type: forward_command_controller/ForwardCommandController

/**/tb20e_gamepad_controller:
  ros__parameters:
    joints:
      - swing_joint
      - boom_joint
      - arm_joint
      - bucket_joint
    interface_name: effort

/**/tb20e_controller:
  ros__parameters:
    joints:
      - swing_joint
      - boom_joint
      - arm_joint
      - bucket_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

    # Output units are lever percent. These are safe starting values for simulation,
    # not validated gains for a physical excavator.
    gains:
      swing_joint:
        p: 2000.0
        i: 0.0
        d: 0.0
        angle_wraparound: true
      boom_joint:
        p: 2000.0
        i: 0.0
        d: 0.0
      arm_joint:
        p: 2000.0
        i: 0.0
        d: 0.0
      bucket_joint:
        p: 2000.0
        i: 0.0
        d: 0.0

    constraints:
      goal_time: 30.0
      stopped_velocity_tolerance: 0.05
      swing_joint:
        goal: 0.04
      boom_joint:
        goal: 0.04
      arm_joint:
        goal: 0.04
      bucket_joint:
        goal: 0.04

# Hardware lever compensation, read by the control launch from this same file.
# Positive/negative refer to the published lever sign; enter positive magnitudes.
# 0 disables compensation in that direction. Changes take effect after restart.
/**/tb20e_lever_hardware:
  ros__parameters:
    swing_lever_positive_min: 0.0
    swing_lever_negative_min: 0.0
    swing_lever_start: 2.0
    swing_lever_stop: 1.0
    boom_lever_positive_min: 0.0
    boom_lever_negative_min: 0.0
    boom_lever_start: 2.0
    boom_lever_stop: 1.0
    arm_lever_positive_min: 0.0
    arm_lever_negative_min: 0.0
    arm_lever_start: 2.0
    arm_lever_stop: 1.0
    bucket_lever_positive_min: 45.0
    bucket_lever_negative_min: 38.0
    bucket_lever_start: 2.0
    bucket_lever_stop: 1.0