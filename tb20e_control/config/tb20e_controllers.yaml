controller_manager:
  ros__parameters:
    # This rate also determines the lever publication period: 20 Hz = 50 ms.
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tb20e_controller:
      type: joint_trajectory_controller/JointTrajectoryController

tb20e_controller:
  ros__parameters:
    joints:
      - swing_joint
      - boom_joint
      - arm_joint
      - bucket_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

    # Output units are lever percent. These are safe starting values for simulation,
    # not validated gains for a physical excavator.
    gains:
      swing_joint:
        p: 30.0
        i: 0.0
        d: 2.0
        angle_wraparound: true
      boom_joint:
        p: 40.0
        i: 0.0
        d: 3.0
      arm_joint:
        p: 35.0
        i: 0.0
        d: 3.0
      bucket_joint:
        p: 30.0
        i: 0.0
        d: 2.5

    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.05
      swing_joint:
        goal: 0.04
      boom_joint:
        goal: 0.04
      arm_joint:
        goal: 0.04
      bucket_joint:
        goal: 0.04
