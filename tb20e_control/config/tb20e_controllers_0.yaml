/**/controller_manager:
  ros__parameters:
    # この頻度はレバー値の配信周期も決める。20Hzは50ミリ秒。
    update_rate: 20

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    tb20e_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    tb20e_gamepad_controller:
      type: forward_command_controller/ForwardCommandController

# 4軸共通のゲームパッドスティックの不感帯（0 <= deadzone < 1）。
# 変更はゲームパッドの起動処理を再実行すると反映される。
/**/tb20e_gamepad:
  ros__parameters:
    deadzone: 0.30

/**/tb20e_gamepad_controller:
  ros__parameters:
    joints:
      - swing_joint
      - boom_joint
      - arm_joint
      - bucket_joint
    interface_name: effort

/**/tb20e_controller:
  ros__parameters:
    joints:
      - swing_joint
      - boom_joint
      - arm_joint
      - bucket_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

    state_publish_rate: 20.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: false

    # TB20e_0のHTTP調整値。出力単位はレバーのパーセント値。
    gains:
      swing_joint:
        p: 300.0
        i: 0.0
        d: 100.0
        angle_wraparound: true
      boom_joint:
        p: 350.0
        i: 0.0
        d: 0.0
      arm_joint:
        p: 500.0
        i: 0.0
        d: 0.0
      bucket_joint:
        p: 200.0
        i: 0.0
        d: 0.0

    constraints:
      goal_time: 8.0
      stopped_velocity_tolerance: 0.05
      swing_joint:
        goal: 0.04
      boom_joint:
        goal: 0.04
      arm_joint:
        goal: 0.04
      bucket_joint:
        goal: 0.04

# 実機レバーの制限と補償値。制御起動処理がこのファイルから読み込む。
# 正負は配信するレバー値の符号を指す。設定値には正の大きさを入力する。
# 最小値を0にすると、その方向の補償を無効にする。変更後は再起動が必要。
/**/tb20e_lever_hardware:
  ros__parameters:
    swing_lever_positive_max: 100.0
    swing_lever_negative_max: 100.0
    swing_lever_positive_min: 40.0
    swing_lever_negative_min: 40.0
    swing_lever_start: 2.0
    swing_lever_stop: 1.0
    boom_lever_positive_max: 70.0
    boom_lever_negative_max: 100.0
    boom_lever_positive_min: 40.0
    boom_lever_negative_min: 35.0
    boom_lever_start: 2.0
    boom_lever_stop: 1.0
    arm_lever_positive_max: 100.0
    arm_lever_negative_max: 100.0
    arm_lever_positive_min: 40.0
    arm_lever_negative_min: 40.0
    arm_lever_start: 8.0
    arm_lever_stop: 5.0
    bucket_lever_positive_max: 60.0
    bucket_lever_negative_max: 70.0
    bucket_lever_positive_min: 40.0
    bucket_lever_negative_min: 35.0
    bucket_lever_start: 8.0
    bucket_lever_stop: 5.0

# HTTPゴールではconstraints.<joint>.goalとstopped_velocity_toleranceを上書きする。
/**/scratch_hci_bridge:
  ros__parameters:
    # HTTP動作指令の既定速度（度/秒）。0の場合はtrajectory_duration_secを使用する。
    swing_default_speed_deg_s: 50.0
    boom_default_speed_deg_s: 50.0
    arm_default_speed_deg_s: 60.0
    bucket_default_speed_deg_s: 60.0
    # 4軸共通のHTTPアクション完了許容誤差（単位は度）。
    trajectory_goal_tolerance_deg: 3.0
    trajectory_stopped_velocity_deg_s: 2.0
